<svg xmlns="http://www.w3.org/2000/svg" width="360" height="720" viewBox="0 0 360 720" role="img" aria-label="日程岛收集箱界面预览">
  <rect width="360" height="720" rx="28" fill="#f7faf6"/>
  <circle cx="32" cy="44" r="21" fill="#ffe100" stroke="#1d1e1c" stroke-width="3"/><circle cx="54" cy="44" r="21" fill="#fff" stroke="#1d1e1c" stroke-width="3"/>
  <text x="70" y="34" font-size="15" font-family="sans-serif" font-weight="800" fill="#a5a7ab">先收起来，晚点整理</text>
  <text x="70" y="70" font-size="32" font-family="sans-serif" font-weight="900" fill="#111">收集箱</text>
  <circle cx="318" cy="45" r="25" fill="#ffe100" stroke="#1d1e1c" stroke-width="3"/><text x="307" y="57" font-size="34" font-family="sans-serif" font-weight="500" fill="#111">+</text>
  <rect x="18" y="100" width="324" height="136" rx="10" fill="#fff" stroke="#e8e8e8"/>
  <text x="36" y="148" font-size="18" font-family="sans-serif" font-weight="800" fill="#55524a">随手记下待整理的内容</text>
  <g fill="#eee6be"><circle cx="56" cy="190" r="19"/><circle cx="96" cy="190" r="19"/><circle cx="136" cy="190" r="19"/></g>
