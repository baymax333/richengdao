  <rect x="220" y="172" width="96" height="38" rx="19" fill="#1e1f23"/><text x="240" y="197" font-size="15" font-family="sans-serif" font-weight="900" fill="#fff">丢进收集箱</text>
  <text x="18" y="282" font-size="27" font-family="sans-serif" font-weight="900" fill="#111">整理为</text><text x="282" y="276" font-size="15" font-family="sans-serif" font-weight="800" fill="#a1a4aa">拖拽到这里</text>
  <g font-family="sans-serif" font-size="18" font-weight="900" fill="#6f6a00"><rect x="18" y="310" width="72" height="36" rx="18" fill="#fff" stroke="#e9e9e9"/><text x="43" y="334">任务</text><rect x="102" y="310" width="72" height="36" rx="18" fill="#fff" stroke="#e9e9e9"/><text x="127" y="334">日程</text><rect x="186" y="310" width="72" height="36" rx="18" fill="#fff" stroke="#e9e9e9"/><text x="211" y="334">习惯</text><rect x="270" y="310" width="72" height="36" rx="18" fill="#fff" stroke="#e9e9e9"/><text x="295" y="334">笔记</text></g>
  <text x="18" y="398" font-size="27" font-family="sans-serif" font-weight="900" fill="#111">待整理</text><text x="306" y="394" font-size="17" font-family="sans-serif" font-weight="900" fill="#a1a4aa">0 条</text>
  <text x="125" y="470" font-size="18" font-family="sans-serif" font-weight="900" fill="#a1a4aa">待整理内容已清空</text>
  <rect y="652" width="360" height="68" fill="#dedede"/>
  <ellipse cx="153" cy="680" rx="36" ry="22" fill="#ffe100"/>
  <g font-family="sans-serif" font-size="13" font-weight="800" fill="#4b4a42"><text x="20" y="702">打卡</text><text x="76" y="702">日历</text><text x="130" y="702">收集箱</text><text x="198" y="702">专注</text><text x="247" y="702">临时笔记</text><text x="320" y="702">关于</text></g>
